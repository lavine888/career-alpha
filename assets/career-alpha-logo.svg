<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Career Alpha Orb logo</title>
  <desc id="desc">A soft blue-violet-mint planet with a cream orbital ring, a subtle A mark, and a rising arrow on a midnight rounded-square background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111F"/>
      <stop offset="1" stop-color="#101B2F"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CB7FF"/>
      <stop offset="0.52" stop-color="#CBB7FF"/>
      <stop offset="1" stop-color="#9EF0C8"/>
    </linearGradient>
    <linearGradient id="orbSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#7CB7FF" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bg)"/>
  <rect x="24.5" y="24.5" width="463" height="463" rx="115.5" fill="none" stroke="#2A3D5C"/>

  <!-- back half of orbital ring -->
  <path d="M112 274 C146 211 357 177 409 237" fill="none" stroke="#FFE08A" stroke-width="18" stroke-linecap="round" opacity="0.88"/>

  <!-- orb -->
  <circle cx="258" cy="259" r="118" fill="url(#orb)" filter="url(#shadow)"/>
  <ellipse cx="226" cy="211" rx="70" ry="47" fill="url(#orbSoft)" transform="rotate(-22 226 211)"/>

  <!-- hidden A -->
  <path d="M206 306 L253 207 L301 306 M224 270 H283" fill="none" stroke="#F8FAFC" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity="0.82"/>

  <!-- front half of orbital ring -->
  <path d="M109 276 C166 340 357 337 410 239" fill="none" stroke="#FFE08A" stroke-width="18" stroke-linecap="round" opacity="0.96"/>

  <!-- alpha / growth arrow -->
  <path d="M357 137 L398 96 M398 96 L396 138 M398 96 L356 99" fill="none" stroke="#FFE08A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="338" cy="120" r="7" fill="#FFE08A" opacity="0.7"/>
</svg>
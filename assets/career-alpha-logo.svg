<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Career Alpha logo</title>
  <desc id="desc">A dark rounded square with a rising alpha wedge mark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="1" stop-color="#111b31"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#d6a85a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>
  <rect x="24.5" y="24.5" width="463" height="463" rx="111.5" fill="none" stroke="#273653"/>
  <path d="M126 355 L224 148 L276 148 L379 355 L323 355 L294 289 L205 289 L178 355 Z" fill="none" stroke="url(#mark)" stroke-width="30" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M203 288 C219 238 247 215 280 215 C320 215 340 247 340 286 C340 324 319 352 286 352 C260 352 242 337 233 318" fill="none" stroke="#f8fafc" stroke-width="20" stroke-linecap="round" opacity="0.95"/>
  <path d="M339 170 L374 135 M374 135 L372 174 M374 135 L335 138" fill="none" stroke="#d6a85a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
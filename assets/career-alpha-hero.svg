    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>

  <rect width="1400" height="620" rx="42" fill="url(#bg)"/>
  <circle cx="105" cy="68" r="100" fill="#7cb7ff" opacity="0.07" filter="url(#glow)"/>
  <circle cx="1280" cy="90" r="125" fill="#cbb7ff" opacity="0.07" filter="url(#glow)"/>
  <circle cx="710" cy="602" r="150" fill="#9ef0c8" opacity="0.04" filter="url(#glow)"/>

  <g font-family="Inter,Arial,sans-serif">

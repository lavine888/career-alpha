<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Career Alpha workflow hero</title>
  <desc id="desc">A product-style visual showing Scan, Wedge, Build, Proof, Position and Offer as a career hypothesis loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="1" stop-color="#111a2f"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.55" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#d6a85a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1400" height="620" rx="42" fill="url(#bg)"/>
  <circle cx="1220" cy="80" r="210" fill="#15315e" opacity="0.28"/>
  <circle cx="180" cy="570" r="250" fill="#173456" opacity="0.18"/>

  <g transform="translate(92 74)">
    <rect x="0" y="0" width="74" height="74" rx="18" fill="#0f1b30" stroke="#30486d"/>
    <path d="M17 56 L33 21 L43 21 L60 56 L49 56 L44 46 L28 46 L24 56 Z" fill="none" stroke="url(#line)" stroke-width="6" stroke-linejoin="round"/>
    <text x="94" y="31" fill="#f8fafc" font-size="34" font-family="Inter,Arial,sans-serif" font-weight="700">Career Alpha</text>
    <text x="94" y="61" fill="#9fb0c8" font-size="18" font-family="Inter,Arial,sans-serif">Find your career alpha before consensus.</text>
  </g>

  <g font-family="Inter,Arial,sans-serif">
    <text x="92" y="210" fill="#ffffff" font-size="56" font-weight="750">Build the next valuable fact.</text>
    <text x="92" y="252" fill="#a9bad0" font-size="22">Not another resume-polishing prompt. A career hypothesis loop built on real evidence.</text>
  </g>

  <g transform="translate(92 330)" filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <g>
      <rect x="0" y="0" width="170" height="130" rx="24" fill="#0c1729" stroke="#284162"/>
      <text x="24" y="35" fill="#7dd3fc" font-size="14" font-weight="700" letter-spacing="2">01 / RADAR</text>
      <text x="24" y="72" fill="#f8fafc" font-size="25" font-weight="700">Scan</text>
      <text x="24" y="101" fill="#91a5bf" font-size="15">Demand before hype</text>
    </g>
    <path d="M184 65 H224" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
    <path d="M216 56 L226 65 L216 74" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/>

    <g transform="translate(238 0)">
      <rect x="0" y="0" width="170" height="130" rx="24" fill="#0c1729" stroke="#284162"/>
      <text x="24" y="35" fill="#7dd3fc" font-size="14" font-weight="700" letter-spacing="2">02 / WEDGE</text>
      <text x="24" y="72" fill="#f8fafc" font-size="25" font-weight="700">Enter</text>
      <text x="24" y="101" fill="#91a5bf" font-size="15">Small asymmetric edge</text>
    </g>
    <path d="M422 65 H462" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
    <path d="M454 56 L464 65 L454 74" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/>

    <g transform="translate(476 0)">
      <rect x="0" y="0" width="170" height="130" rx="24" fill="#0c1729" stroke="#284162"/>
      <text x="24" y="35" fill="#7dd3fc" font-size="14" font-weight="700" letter-spacing="2">03 / BUILD</text>
      <text x="24" y="72" fill="#f8fafc" font-size="25" font-weight="700">Create</text>
      <text x="24" y="101" fill="#91a5bf" font-size="15">2–7 day proof of work</text>
    </g>
    <path d="M660 65 H700" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
    <path d="M692 56 L702 65 L692 74" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/>

    <g transform="translate(714 0)">
      <rect x="0" y="0" width="170" height="130" rx="24" fill="#0c1729" stroke="#284162"/>
      <text x="24" y="35" fill="#7dd3fc" font-size="14" font-weight="700" letter-spacing="2">04 / PROOF</text>
      <text x="24" y="72" fill="#f8fafc" font-size="25" font-weight="700">Verify</text>
      <text x="24" y="101" fill="#91a5bf" font-size="15">Claim → evidence</text>
    </g>
    <path d="M898 65 H938" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
    <path d="M930 56 L940 65 L930 74" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/>

    <g transform="translate(952 0)">
      <rect x="0" y="0" width="170" height="130" rx="24" fill="#0c1729" stroke="#284162"/>
      <text x="24" y="35" fill="#d6a85a" font-size="14" font-weight="700" letter-spacing="2">05 / POSITION</text>
      <text x="24" y="72" fill="#f8fafc" font-size="25" font-weight="700">Translate</text>
      <text x="24" y="101" fill="#91a5bf" font-size="15">Safe / Strong / Future</text>
    </g>
    <path d="M1136 65 H1176" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
    <path d="M1168 56 L1178 65 L1168 74" fill="none" stroke="#d6a85a" stroke-width="4" stroke-linecap="round"/>

    <g transform="translate(1190 0)">
      <rect x="0" y="0" width="118" height="130" rx="24" fill="#151a26" stroke="#6d5730"/>
      <text x="18" y="35" fill="#d6a85a" font-size="14" font-weight="700">06 / MARKET</text>
      <text x="18" y="72" fill="#f8fafc" font-size="23" font-weight="700">Learn</text>
      <text x="18" y="101" fill="#b9a77f" font-size="14">Keep / pivot</text>
    </g>
  </g>

  <path d="M1280 505 C1280 560 1170 575 1035 575 H250 C150 575 100 548 100 500" fill="none" stroke="#365477" stroke-width="3" stroke-dasharray="8 10" opacity="0.8"/>
  <path d="M98 501 L88 486 M98 501 L112 490" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
  <text x="557" y="595" fill="#7388a4" font-size="14" font-family="Inter,Arial,sans-serif" letter-spacing="2">CAREER HYPOTHESIS LOOP</text>
</svg>
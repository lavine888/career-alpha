        <text x="16" y="107" fill="#f8f9fd" font-size="21" font-weight="700">Learn</text>
        <text x="16" y="132" fill="#94a8c3" font-size="12">Keep</text><text x="16" y="148" fill="#94a8c3" font-size="12">or pivot</text>

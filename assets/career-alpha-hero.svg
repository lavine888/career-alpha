      <path d="M1079 106 H1101" stroke="#f7a8c6" stroke-width="3" stroke-linecap="round"/><path d="M1094 100 L1102 106 L1094 112" fill="none" stroke="#f7a8c6" stroke-width="3" stroke-linecap="round"/>

      <g transform="translate(1112 26)">
        <rect width="90" height="160" rx="24" fill="#13231f" stroke="#31594c"/>
        <rect x="16" y="18" width="31" height="31" rx="11" fill="#19372e" stroke="#315d4c"/><text x="25" y="39" fill="#9ef0c8" font-size="15">✦</text>

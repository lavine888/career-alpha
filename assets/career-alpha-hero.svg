        <rect width="176" height="160" rx="24" fill="#101f35" stroke="#2a405f"/>
        <rect x="18" y="18" width="31" height="31" rx="11" fill="#211f39" stroke="#4c426d"/><text x="27" y="39" fill="#cbb7ff" font-size="15">◌</text>
        <text x="18" y="76" fill="#cbb7ff" font-size="12" font-weight="700" letter-spacing="1.5">04 / PROOF</text>
        <text x="18" y="107" fill="#f8f9fd" font-size="24" font-weight="700">Verify</text>
        <text x="18" y="133" fill="#94a8c3" font-size="13">Claim → evidence</text>
      </g>
      <path d="M861 106 H883" stroke="#cbb7ff" stroke-width="3" stroke-linecap="round"/><path d="M876 100 L884 106 L876 112" fill="none" stroke="#cbb7ff" stroke-width="3" stroke-linecap="round"/>

      <g transform="translate(894 26)">
        <rect width="176" height="160" rx="24" fill="#101f35" stroke="#2a405f"/>
        <rect x="18" y="18" width="31" height="31" rx="11" fill="#342335" stroke="#65415a"/><text x="27" y="39" fill="#f7a8c6" font-size="15">✎</text>
        <text x="18" y="76" fill="#f7a8c6" font-size="12" font-weight="700" letter-spacing="1.5">05 / POSITION</text>
        <text x="18" y="107" fill="#f8f9fd" font-size="24" font-weight="700">Translate</text>
        <text x="18" y="133" fill="#94a8c3" font-size="13">Safe / Strong / Future</text>

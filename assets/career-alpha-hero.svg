    <path d="M1250 530 C1240 576 1140 590 1010 590 H250 C150 590 102 565 102 520" fill="none" stroke="#405670" stroke-width="2.5" stroke-dasharray="7 9" opacity="0.8"/>
    <path d="M102 520 L93 507 M102 520 L114 510" fill="none" stroke="#8ce7f1" stroke-width="2.8" stroke-linecap="round"/>
    <text x="555" y="598" fill="#7388a4" font-size="13" letter-spacing="2">CAREER HYPOTHESIS LOOP</text>

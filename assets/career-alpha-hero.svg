      <g transform="translate(240 26)">
        <rect width="176" height="160" rx="24" fill="#101f35" stroke="#2a405f"/>
        <rect x="18" y="18" width="31" height="31" rx="11" fill="#282439" stroke="#5d5030"/><text x="27" y="39" fill="#ffe08a" font-size="15">◇</text>
        <text x="18" y="76" fill="#ffe08a" font-size="12" font-weight="700" letter-spacing="1.5">02 / WEDGE</text>
        <text x="18" y="107" fill="#f8f9fd" font-size="24" font-weight="700">Enter</text>
        <text x="18" y="133" fill="#94a8c3" font-size="13">Small asymmetric edge</text>
      </g>
      <path d="M425 106 H447" stroke="#8ce7f1" stroke-width="3" stroke-linecap="round"/><path d="M440 100 L448 106 L440 112" fill="none" stroke="#8ce7f1" stroke-width="3" stroke-linecap="round"/>

      <g transform="translate(458 26)">
        <rect width="176" height="160" rx="24" fill="#101f35" stroke="#2a405f"/>
        <rect x="18" y="18" width="31" height="31" rx="11" fill="#173329" stroke="#315d4c"/><text x="27" y="39" fill="#9ef0c8" font-size="15">✓</text>

      <ellipse cx="31" cy="33" rx="40" ry="12" fill="none" stroke="#ffe08a" stroke-width="2.4" opacity="0.82" transform="rotate(-14 31 33)"/>
      <circle cx="20" cy="27" r="3.4" fill="#172238"/><circle cx="42" cy="27" r="3.4" fill="#172238"/>
      <path d="M24 39 Q31 46 39 39" fill="none" stroke="#172238" stroke-width="2.4" stroke-linecap="round"/>
      <text x="54" y="5" fill="#ffe08a" font-size="19">✦</text>
    </g>

    <text x="172" y="93" fill="#f8f9fd" font-size="34" font-weight="760">Career Alpha</text>
    <text x="172" y="122" fill="#a6b5cb" font-size="17">AI-native Career OS · cute but competent</text>

    <g transform="translate(1015 70)">

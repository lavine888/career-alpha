<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Career Alpha cute-tech workflow hero</title>
  <desc id="desc">Career Alpha career hypothesis loop in the same soft cute-tech visual language as the Workbench.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1424"/>
      <stop offset="0.52" stop-color="#08111f"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="mascot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#91c8ff"/>
      <stop offset="0.52" stop-color="#bdaeff"/>
      <stop offset="1" stop-color="#9ef0c8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cb7ff"/>
      <stop offset="0.55" stop-color="#8ce7f1"/>
      <stop offset="1" stop-color="#9ef0c8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">

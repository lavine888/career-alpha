      <path d="M643 106 H665" stroke="#9ef0c8" stroke-width="3" stroke-linecap="round"/><path d="M658 100 L666 106 L658 112" fill="none" stroke="#9ef0c8" stroke-width="3" stroke-linecap="round"/>


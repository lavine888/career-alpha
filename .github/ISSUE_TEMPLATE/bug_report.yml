name: Bug report
about: Report a broken skill route, Workbench issue, validator regression, or packaging problem.
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Skill behavior / routing
        - Workbench
        - Plugin manifest / installation
        - Validation / CI
        - Documentation / link
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest input, file, command, or sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: "Codex / Claude Code / OpenCode / browser / OS / commit if relevant"
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed private job-search, recruiter, compensation, or company-confidential data from this issue.
          required: true

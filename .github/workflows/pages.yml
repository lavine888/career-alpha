name: Deploy Workbench to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "assets/career-alpha-workbench.html"
      - "assets/career-alpha-logo.svg"
      - "assets/career-alpha-logo-small.svg"
      - "assets/career-alpha-mascot.svg"
      - "assets/workbench-state.schema.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build static demo
        run: |
          mkdir -p _site
          cp assets/career-alpha-workbench.html _site/index.html
          cp assets/career-alpha-logo.svg _site/
          cp assets/career-alpha-logo-small.svg _site/
          cp assets/career-alpha-mascot.svg _site/
          cp assets/workbench-state.schema.json _site/
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

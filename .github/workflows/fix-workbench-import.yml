name: One-shot Workbench syntax repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-workbench-import.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Repair import handler syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/career-alpha-workbench.html')
          text = p.read_text(encoding='utf-8')
          old = "$('fileInput').onchange=e=>{let f=e.target.files[0];if(!f)return,r=new FileReader;"
          new = "$('fileInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;"
          if old not in text:
              raise SystemExit('expected broken import handler not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name "career-alpha-ci"
          git config user.email "actions@users.noreply.github.com"
          git add assets/career-alpha-workbench.html
          git commit -m "fix(workbench): repair JSON import handler syntax"
          git push

name: Validate Career Alpha package contract

on:
  push:
    paths:
      - "package.json"
      - "lib/**"
      - "skills/**"
      - "references/**"
      - "assets/**"
      - "docs/**"
      - "examples/**"
      - "README.md"
      - "README_en.md"
      - "ROADMAP.md"
      - "CHANGELOG.md"
      - ".gitignore"
      - ".codex-plugin/**"
      - ".claude-plugin/**"
      - ".opencode-plugin/**"
      - ".trae-plugin/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-package.yml"
  pull_request:
    paths:
      - "package.json"
      - "lib/**"
      - "skills/**"
      - "references/**"
      - "assets/**"
      - "docs/**"
      - "examples/**"
      - "README.md"
      - "README_en.md"
      - "ROADMAP.md"
      - "CHANGELOG.md"
      - ".gitignore"
      - ".codex-plugin/**"
      - ".claude-plugin/**"
      - ".opencode-plugin/**"
      - ".trae-plugin/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-package.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate skill and package contracts
        run: |
          python3 scripts/validate_skills.py
          python3 scripts/validate_package.py
          node scripts/validate_node_package.mjs
          node scripts/validate_docs.mjs
          node scripts/eval_handoffs.mjs
          node scripts/eval_integrity.mjs

name: Validate Career Alpha package contract

on:
  push:
    paths:
      - "skills/**"
      - "references/**"
      - "assets/**"
      - ".codex-plugin/**"
      - ".claude-plugin/**"
      - ".opencode-plugin/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-package.yml"
  pull_request:
    paths:
      - "skills/**"
      - "references/**"
      - "assets/**"
      - ".codex-plugin/**"
      - ".claude-plugin/**"
      - ".opencode-plugin/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-package.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate package contract
        run: python3 scripts/validate_package.py

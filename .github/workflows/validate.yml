name: Validate Career Alpha

on:
  push:
    paths:
      - "skills/**"
      - "references/**"
      - "assets/**"
      - ".codex-plugin/**"
      - ".claude-plugin/**"
      - ".opencode-plugin/**"
      - ".trae-plugin/**"
      - "scripts/validate_skills.py"
      - "tests/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "skills/**"
      - "references/**"
      - "assets/**"
      - ".codex-plugin/**"
      - ".claude-plugin/**"
      - ".opencode-plugin/**"
      - ".trae-plugin/**"
      - "scripts/validate_skills.py"
      - "tests/**"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skill package
        run: python3 scripts/validate_skills.py
